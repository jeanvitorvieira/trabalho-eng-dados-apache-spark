[project]
name = "spark-iceberg"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyspark (==3.5.3)",
    "install-jdk (>=1.1.0,<2.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)"
]

[tool.poetry]
packages = [{include = "spark_iceberg", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.6.3,<8.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "jupyterlab (>=4.6.4,<5.0.0)",
    "jupyterlab-lsp (>=5.3.0,<6.0.0)",
    "python-lsp-server (>=1.15.0,<2.0.0)"
]
